version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      # Regenerate the capability catalog from the registry so RTD never
      # publishes stale generated pages.
      - uv run --no-sync --no-dev scripts/generate_catalog.py

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: uv
      command: sync
      extras:
        - docs
