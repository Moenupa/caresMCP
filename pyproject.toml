[project]
name = "caresmcp"
version = "0.1.0"
description = "Medical MCP"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "catalogue>=2,<3",
    "rapidfuzz>=3,<4",
    # processing
    "opencv-python-headless",
    "seaborn",                # incl pillow, numpy
    "filetype>=1,<2",
    # cli and serving
    "curl-cffi>=0.14,<1",
    "typer<1",
    "fastmcp>=4,<5",
]

[project.optional-dependencies]
dicom = ["pydicom>=3,<4"]
torch = ["torch>=2.8,<3", "torchvision"]
hf = [
    "caresmcp[torch,sam]",
    "transformers[torchhub]>=4.57,<5", # incl safetensors
    "einops",
]
skimage = ["scikit-image[optional_free_threaded]"]
timm = ["timm>=1.0.27,<2"]
sam = ["segment-anything", "segmentation-models-pytorch>=0.6,<1"]
monai = ["caresmcp[hf,skimage]", "monai>=1.3"]
totalsegmentator = ["TotalSegmentator>=2.0"]
itk = ["simpleitk>=2.4,<2.6"]
clip = ["open-clip-torch>=4.2.1,<5"]

mri = ["caresmcp[hf,monai,timm,sam,itk]"]
ct = ["caresmcp[torch,hf,timm]"]
xray = [
    "caresmcp[hf,clip,itk]",
    "torchxrayvision>=1.5,<1.6",
    "flexray>=1.0.2,<1.1",
    "onnxruntime>=1.20,<2",
    "hi-ml-multimodal>=0.2.2,<0.3",
]
ultrasound = ["caresmcp[hf,monai,timm]"]
pathology = [
    "caresmcp[torch,monai,timm]",
    "cellpose>=4,<5",
    "conch @ git+https://github.com/Mahmoodlab/CONCH.git", # incl timm
]

[project.scripts]
caresmcp = "caresmcp.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9", "pytest-xdist", "pytest-cov"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "--import-mode=importlib"
markers = [
    "slow: mark tests as slow (pytest -m 'not slow' or set RUN_SLOW=1 to run)",
    "cuda: mark tests as requiring a CUDA device",
]
filterwarnings = ["ignore::torch.serialization.SourceChangeWarning"]
