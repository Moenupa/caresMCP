[project]
name = "caresmcp"
version = "1.0.0"
description = "Medical diagnostic toolkit for agents, served over MCP."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Moenupa", email = "49304833+Moenupa@users.noreply.github.com" }
]
keywords = [
    "medical-imaging",
    "model-context-protocol",
    "mcp",
    "radiology",
    "diagnostic-imaging",
    "deep-learning",
    "healthcare",
    "ai-agents",
]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "catalogue>=2,<3",
    "rapidfuzz>=3,<4",
    # processing
    "opencv-python-headless>=5,<6",
    "seaborn",                # incl pillow, numpy
    "filetype>=1,<2",
    "pydicom>=3,<4",
    # cli and serving
    "curl-cffi>=0.14,<1",
    "typer<1",
    "fastmcp>=4,<5",
]

[project.optional-dependencies]
torch = [
    "torch>=2.13,<3", # hub.load supports safetensors
    "torchvision",
]
hf = [
    "caresmcp[torch,sam]",
    "transformers[torchhub]>=4.57,<5", # incl safetensors
    "einops",
]
skimage = ["scikit-image", "pywavelets"]
timm = ["timm>=1.0.27,<2"]
sam = ["segment-anything", "segmentation-models-pytorch>=0.6,<1"]
monai = ["caresmcp[hf,skimage]", "monai>=1.3"]
totalseg = ["TotalSegmentator>=2,<3"]
itk = ["simpleitk>=2.4,<2.6"]
clip = ["open-clip-torch>=4.2.1,<5"]

ct = [
    "caresmcp[torch,hf,timm,totalseg]",
    # pure-Python, CPU-only PyRadiomics features; pinned because the 2D GLRLM
    # adapter relies on numpyradiomics 0.0.5 internals
    "numpyradiomics>=0.0.5,<0.0.6",
]
dsa = ["caresmcp[hf]"]
mri = ["caresmcp[hf,monai,timm,sam,itk,totalseg]"]
pathology = [
    "caresmcp[torch,monai,timm]",
    "cellpose>=4,<5",
    "environs",
    "sacremoses",
    "conch-fork", # incl timm
]
ultrasound = ["caresmcp[hf,monai,timm]"]
xray = [
    "caresmcp[hf,clip,itk]",
    "torchxrayvision>=1.5,<1.6",
    "flexray>=1.0.2,<1.1",
    "onnxruntime>=1.20,<2",
    "hi-ml-multimodal>=0.2.2,<0.3",
]

all = [
    "caresmcp[ct,dsa,mri,pathology,ultrasound,xray]"
]
docs = [
    "sphinx>=9,<10",
    "myst-parser>=5,<6",
    "sphinx-autodoc-typehints",
    "sphinx-design",
    "sphinxawesome-theme",
    "sphinxcontrib-bibtex",
]

[project.urls]
Homepage = "https://caresmcp.readthedocs.io"
Documentation = "https://caresmcp.readthedocs.io/"
Repository = "https://github.com/Moenupa/caresMCP.git"
Issues = "https://github.com/Moenupa/caresMCP/issues"

[project.scripts]
caresmcp = "caresmcp.cli:app"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9", "pytest-xdist", "pytest-cov"]

[tool.docstrfmt]
preserve-adornments = true
line-length = 88
indent-width = 3

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "--import-mode=importlib"
markers = [
    "slow: mark tests as slow (pytest -m 'not slow' or set RUN_SLOW=1 to run)",
    "cuda: mark tests as requiring a CUDA device",
]
filterwarnings = ["ignore::torch.serialization.SourceChangeWarning"]
