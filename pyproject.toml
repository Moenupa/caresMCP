[project]
name = "caresmcp"
version = "0.1.0"
description = "Medical MCP"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "catalogue>=2,<3",
    "rapidfuzz>=3,<4",
    # processing
    "opencv-python-headless",
    "seaborn", # incl pillow, numpy
    "filetype>=1,<2",
    # cli and serving
    "typer<1",
    "fastmcp>=4,<5",
]

[project.optional-dependencies]
torch = [
    "torch>=2.8,<3",
    "torchvision",
]
monai = [
    "caresmcp[torch]",
    "monai>=1.3",
]
totalsegmentator = [
    "TotalSegmentator>=2.0",
]
hf = [
    "caresmcp[torch]",
    "transformers[torchhub]>=4.57,<5",
    "einops",
]
xray = [
    "caresmcp[torch]",
    "torchxrayvision>=1.2.4",
]
pathology = [
    "caresmcp[torch]",
    "cellpose>=4,<5",
    "conch @ git+https://github.com/Mahmoodlab/CONCH.git", # incl timm
]
medical-dicom = [
    "pydicom>=3.0",
]

[project.scripts]
caresmcp = "caresmcp.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-xdist",
    "pytest-cov"
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "--import-mode=importlib"
markers = [
    "slow: mark tests as slow (pytest -m 'not slow' or set RUN_SLOW=1 to run)",
    "cuda: mark tests as requiring a CUDA device",
]
