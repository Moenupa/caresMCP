name: "Docs Check"
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "src/**/*.py"
      - "scripts/**"
      - "README.md"
      - "pyproject.toml"
      - "Makefile"
      - ".readthedocs.yaml"
  pull_request:
    branches:
      - "main"
    paths:
      - "docs/**"
      - "src/**/*.py"
      - "scripts/**"
      - "README.md"
      - "pyproject.toml"
      - "Makefile"
      - ".readthedocs.yaml"
jobs:
  docs:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Check generated catalog
        run: make catalog-check
