name: "Publish"
on:
  push:
    tags:
      - v*
jobs:
  publish:
    runs-on: "ubuntu-latest"
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Check Format
        run: make format-check
      - name: Build
        run: uv build
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl caresmcp list
      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz caresmcp list
      - name: Publish
        run: uv publish
